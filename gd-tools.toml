[godot]

[test]
test_dirs = [
    "test",
    "tests",
]
prefix = "test_"
suffix = ".gd"
runtime = "native"
timeout_seconds = 5.0
retries = 0
tags = []

[lint]
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
]

[format]
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
]
max_line_length = 100

[coverage]
enabled = false
min_percent = 0
format = "html"
output_dir = ".gd-tools/coverage"
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
    # Coverage injector cannot parse this file (Godot error 43 on injected
    # trackers) and it is untouched input glue: exclude from measurement.
    # Tech debt: re-include once gd-tools handles the construct.
    "src/input/touch_controls.gd",
]
test_dirs = [
    "test",
    "tests",
]
